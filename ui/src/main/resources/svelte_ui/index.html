    <script>
        let currentWorkflowId = null;
        let statusInterval = null;

        // Load server info
        fetch('/serverinfo')
            .then(response => response.json())
            .then(data => {
                const serverInfoDiv = document.querySelector('.px-6.py-3.bg-gray-100.text-center');
                if (serverInfoDiv) {
                    serverInfoDiv.innerHTML = `
                        <p class="text-gray-400 text-sm">Temporal Server</p>
                        <p class="text-gray-400 text-sm">${data.temporalServerAddress || 'undefined'}</p>
                        <p class="text-gray-400 text-sm">Namespace: ${data.namespace || 'undefined'}</p>
                    `;
                }
            })
            .catch(error => console.error('Error loading server info:', error));

        // Load workflow list
        function loadWorkflowList() {
            fetch('/listWorkflows')
                .then(response => response.json())
                .then(workflows => {
                    const tbody = document.getElementById('workflowTableBody');
                    tbody.innerHTML = '';
                    workflows.forEach(workflow => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td class="px-5 py-3 border-b border-gray-200 text-sm">${workflow.workflowId}</td>
                            <td class="px-5 py-3 border-b border-gray-200 text-sm">${workflow.status}</td>
                            <td class="px-5 py-3 border-b border-gray-200 text-sm">${workflow.amount || 'N/A'}</td>
                        `;
                    });
                })
                .catch(error => console.error('Error loading workflows:', error));
        }

        // Initial load
        loadWorkflowList();

        // Money Transfer form submission
        document.getElementById('transferButton').addEventListener('click', function() {
            const formData = {
                amount: parseInt(document.getElementById('amount').value),
                scenario: document.getElementById('simulate').value
            };

            this.disabled = true;
            this.textContent = 'Processing...';

            fetch('/runWorkflow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                currentWorkflowId = data.transferId;
                document.getElementById('workflowId').textContent = currentWorkflowId;
                document.getElementById('statusSection').style.display = 'block';
                document.getElementById('statusTitle').textContent = 'Transfer Status';
                document.getElementById('approvalMessage').textContent = 'Please confirm that you want to proceed with this transfer.';
                document.getElementById('approveBtn').textContent = 'Approve Transfer';
                startStatusPolling();
                loadWorkflowList();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error starting transfer: ' + error.message);
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = 'Transfer';
            });
        });


        function startStatusPolling() {
            if (statusInterval) {
                clearInterval(statusInterval);
            }

            statusInterval = setInterval(() => {
                if (currentWorkflowId) {
                    checkWorkflowStatus(currentWorkflowId);
                }
            }, 2000);
        }

        function checkWorkflowStatus(workflowId) {
            fetch('/runQuery', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workflowId: workflowId })
            })
            .then(response => response.json())
            .then(status => {
                document.getElementById('status').textContent = status.transferState;
                document.getElementById('progress').textContent = status.progress;
                document.getElementById('progressBar').style.width = status.progress + '%';

                const statusCard = document.getElementById('statusCard');
                const approvalSection = document.getElementById('approvalSection');

                if (status.transferState === 'waiting') {
                    statusCard.classList.add('waiting-approval');
                    approvalSection.style.display = 'block';
                } else {
                    statusCard.classList.remove('waiting-approval');
                    approvalSection.style.display = 'none';
                }

                if (status.transferState === 'finished' || status.progress >= 100) {
                    clearInterval(statusInterval);
                    statusInterval = null;
                    loadWorkflowList();
                }
            })
            .catch(error => {
                console.error('Error checking status:', error);
            });
        }

        // Approval button
        document.getElementById('approveBtn').addEventListener('click', function() {
            if (currentWorkflowId) {
                fetch('/approveTransfer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workflowId: currentWorkflowId })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('approvalSection').style.display = 'none';
                    document.getElementById('statusCard').classList.remove('waiting-approval');
                })
                .catch(error => {
                    console.error('Error sending approval:', error);
                    alert('Error sending approval: ' + error.message);
                });
            }
        });

        // Initialize Svelte components first, then our custom functionality
        {
            __sveltekit_gwo2qf = {

                import("./_app/immutable/entry/app.65a2436b.js")
            ]).then(([kit, app]) => {

                    node_ids: [0, 2],

                setTimeout(() => {
                    console.log('Initializing custom functionality after Svelte...');
                    initializePage();

            });
